# 预发环境配置。jwt.secret / redis.password 必须由环境变量注入（VG_JWT_SECRET / VG_REDIS_PASSWORD），
# 此处留空，启动时校验会拒绝空 secret。
env: staging

server:
  addr: ":8080"
  mode: release

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

postgres:
  # 真实 DSN 由 VG_POSTGRES_DSN 注入。
  dsn: ""

jwt:
  secret: ""
  issuer: "vulture-gateway"
  access_ttl: "30m"

oauth:
  client_id: "vulture-desktop"
  gateway_base_url: ""
  gw_code_ttl: "60s"
  authz_ttl: "10m"

# LLM 代理（litellm proxy，ADR-0005/0014）：base_url 切到新实例，必须与 master_key 同实例否则签发全 401。
# master_key 留空，强制由 VG_LLM_MASTER_KEY 注入（validate 拒绝空值）。
llm:
  base_url: "https://litellm-0w6x.srv1477684.hstgr.cloud"
  master_key: ""
  vkey_cache_ttl: "1h"

# 预发关闭脚手架签发端点。
scaffold:
  enabled: false
