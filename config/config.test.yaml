# 测试环境配置。契约测试不读此文件（直接构造 Configuration），此处供联调/集成环境使用。
env: test

server:
  addr: ":8080"
  mode: test

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 1

postgres:
  dsn: "host=127.0.0.1 user=postgres password=postgres dbname=vulture_gateway_test port=5432 sslmode=disable"

jwt:
  secret: "test-only-insecure-secret-change-me"
  issuer: "vulture-gateway"
  access_ttl: "30m"

oauth:
  client_id: "vulture-desktop"
  gateway_base_url: "http://127.0.0.1:8080"
  gw_code_ttl: "60s"
  authz_ttl: "10m"

# LLM 代理（ADR-0016）：test 环境也要配 default_team_alias（validate 强制必填），实际联调按需指向真实 litellm。
llm:
  default_team_alias: "team-pro"

scaffold:
  enabled: true
