# 生产环境配置。jwt.secret / redis.password 必须由环境变量注入（VG_JWT_SECRET / VG_REDIS_PASSWORD），
# 此处留空，启动时校验会拒绝空 secret。脚手架端点强制关闭。
env: prod

server:
  addr: ":8080"
  mode: release

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

postgres:
  # 真实 DSN 由 VG_POSTGRES_DSN 注入。
  dsn: ""

jwt:
  secret: ""
  issuer: "vulture-gateway"
  access_ttl: "30m"

oauth:
  client_id: "vulture-desktop"
  gateway_base_url: ""
  gw_code_ttl: "60s"
  authz_ttl: "10m"
  upstream:
    mode: "oidc"
    authorize_url: ""
    token_url: ""
    client_id: "vulture-gateway"
    client_secret: ""
    scopes: "openid profile"

scaffold:
  enabled: false
