# 开发环境配置。敏感项（jwt.secret）建议用 VG_JWT_SECRET 覆盖，此处给开发占位值。
env: dev

server:
  addr: ":8080"
  mode: debug

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

postgres:
  dsn: "host=127.0.0.1 user=postgres password=postgres dbname=vulture_gateway port=5432 sslmode=disable"

jwt:
  secret: "dev-only-insecure-secret-change-me"
  issuer: "vulture-gateway"
  access_ttl: "30m"

oauth:
  client_id: "vulture-desktop"
  gateway_base_url: "http://127.0.0.1:8080"
  gw_code_ttl: "60s"
  authz_ttl: "10m"
  refresh_ttl: "1440h" # 60 天
  refresh_grace_window: "60s"
  upstream:
    # stub：内置桩上游，#11 本地联调用；真实 Casdoor 待 #10 部署后切 oidc。
    mode: "stub"
    authorize_url: "http://127.0.0.1:8080/oauth/_stub/authorize"
    token_url: ""
    client_id: "vulture-gateway"
    client_secret: ""
    scopes: "openid profile"

# 内网 ClawHub（fork 裁剪版注册中心，ADR-0006）：网关鉴权后转发 skill/plugin 查询。纯内网、无鉴权。
clawhub:
  base_url: "http://127.0.0.1:3210"
  timeout: "10s"

# LLM 代理（litellm proxy，ADR-0005）：网关鉴权后转发，注入 virtual key。key 建议用 VG_LLM_VIRTUAL_KEY 覆盖。
llm:
  base_url: "http://127.0.0.1:4000"
  virtual_key: ""
  timeout: "30s"
  stream_idle_timeout: "120s"   # 流式推理 chunk 间空闲上限（#24 / ADR-0008）
  stream_request_timeout: "30m" # 流式推理单请求总时长上限（#24 / ADR-0008）

# 脚手架内部签发端点（/__dev/*），仅 dev/test 开启，用于 #9 端到端验证。
scaffold:
  enabled: true
